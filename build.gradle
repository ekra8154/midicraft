plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/fast-noteblocks.accesswidener")

	mods {
		"fast-noteblocks" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.terraformersmc.com/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Tests reach into the client source set so the build planner and the machine reader can be
	// run against each other. They are the only pair in the mod where one is supposed to undo the
	// other exactly, and checking that by hand in a world is how a silent off-by-one survives.
	testImplementation sourceSets.client.output
	testImplementation sourceSets.client.compileClasspath
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Console only. The config Loom gives the game rolls latest.log on a new day or on startup and on
// nothing else, so a day of sweeps that print a line per song per config simply grows it -- it
// reached eighteen gigabytes that way. Gradle captures test output regardless, so the file appenders
// were never what anyone read. The working directory stays the project root: every probe here reads
// run/config/fast-noteblocks/songs by relative path.
def consoleOnlyLogging = { Test task ->
	task.systemProperty 'log4j2.configurationFile', file('gradle/log4j2-test.xml').toURI().toString()
	task.systemProperty 'log4j.configurationFile', file('gradle/log4j2-test.xml').toURI().toString()
}

test {
	// Regressions only. The library-wide probes are tagged 'sweep' and left out: they exist to price
	// a change once, not to be re-run on every build, and each of them plans every song at every
	// width and floor count -- several also read every build back through NoteMachineReader, which
	// costs far more than planning it. Together they had taken the suite from ten minutes to
	// forty-three, and a suite that long is one nobody runs.
	useJUnitPlatform {
		excludeTags 'sweep'
	}
	consoleOnlyLogging(it)
}

/** The tagged probes, for when a change needs pricing. Never up to date: the point is the output. */
tasks.register('sweepTest', Test) {
	group = 'verification'
	description = 'Runs the library-wide measurement probes tagged "sweep".'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'sweep'
	}
	// Anything under these prefixes reaches the test JVM, so a probe can be re-aimed from the command
	// line instead of by editing it. Prefixes rather than the lot: forwarding everything would drag
	// the daemon's own properties across and change what the probes are measuring. 'probe.' is the
	// one to use for anything new -- the other two predate it and are what their own probes read.
	//
	// A probe whose prefix is missing here does not fail: it runs with its defaults and prints a full
	// page of numbers for the experiment nobody performed. That happened, and the only tell was that
	// the numbers came out identical to the digit.
	System.properties.each { key, value ->
		if (['fault.', 'census.', 'probe.'].any { key.toString().startsWith(it) }) {
			systemProperty(key.toString(), value)
		}
	}
	consoleOnlyLogging(it)
	outputs.upToDateWhen { false }
}
