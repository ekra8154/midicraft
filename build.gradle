plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// The support range is a label as much as a version predicate, and it shows up in a filename, so
// normalise how it reads: an x-range is written lowercase ("26.2.X" -> "26.2.x"), and each side of
// an "A-B" range is trimmed independently.
def toLowercaseXRange = { String part ->
	return part.toLowerCase().endsWith('.x') ? part.substring(0, part.length() - 1) + 'x' : part
}

def formatMinecraftSupportLabel = { String supportRange ->
	def normalizedRange = supportRange.trim()
	if (normalizedRange.contains('-')) {
		return normalizedRange.split('-', 2).collect { toLowercaseXRange(it.trim()) }.join('-')
	}
	return toLowercaseXRange(normalizedRange)
}

// Normalised once, here, and read everywhere below. The label and the predicate derived from it
// therefore cannot end up spelling the same range two ways, which is half of what this property is
// for.
def minecraftSupportRange = formatMinecraftSupportLabel(project.minecraft_support_range)

// midicraft-fabric-26.2.x-v0.1.0.jar -- loader, then the versions it serves, then the mod's
// own version. Which build you are holding is unambiguous.
def buildArchiveName = "${project.archives_base_name}-fabric-${minecraftSupportRange}"

// The same property has to satisfy two grammars: a filename label, and a Fabric version predicate.
// "1.21.9-1.21.10" reads fine in a filename but is NOT a valid predicate -- Fabric wants
// ">=1.21.9 <=1.21.10" -- so derive it rather than hand-maintaining a second copy. Two copies is how
// a jar ends up declaring a range it was not built for, which is the whole thing this property
// exists to prevent. Exact versions ("26.2") and x-ranges ("26.2.x") are already valid predicates
// and pass through untouched.
def toVersionPredicate = { String supportRange ->
	def normalizedRange = supportRange.trim()
	if (normalizedRange.contains('-')) {
		def bounds = normalizedRange.split('-', 2)
		return ">=${bounds[0].trim()} <=${bounds[1].trim()}"
	}
	return normalizedRange
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = buildArchiveName
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/midicraft.accesswidener")

	mods {
		"midicraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.terraformersmc.com/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Mod Menu only, and only for the entrypoint that puts a button beside the mod in its list.
	// The settings screen it opens is the mod's own, so nothing here is needed to change a setting.
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Tests reach into the client source set so the build planner and the machine reader can be
	// run against each other. They are the only pair in the mod where one is supposed to undo the
	// other exactly, and checking that by hand in a world is how a silent off-by-one survives.
	testImplementation sourceSets.client.output
	testImplementation sourceSets.client.compileClasspath
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version_predicate", toVersionPredicate(minecraftSupportRange)
	filesMatching("fabric.mod.json") {
		expand(
			"version": inputs.properties.version,
			"minecraft_version_predicate": inputs.properties.minecraft_version_predicate
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	archiveVersion = "v${project.version}"
}

tasks.named("sourcesJar") {
	archiveVersion = "v${project.version}"
}

// The remapped jars are what actually ship, and they would otherwise re-derive the version and drop
// the v-prefix set above. Matched by name rather than referenced directly so the script still
// evaluates if loom stops registering them.
tasks.matching { it.name in ["remapJar", "remapSourcesJar"] }.configureEach {
	archiveVersion = "v${project.version}"
}

// Console only. The config Loom gives the game rolls latest.log on a new day or on startup and on
// nothing else, so a day of sweeps that print a line per song per config simply grows it -- it
// reached eighteen gigabytes that way. Gradle captures test output regardless, so the file appenders
// were never what anyone read. The working directory stays the project root: every probe here reads
// run/config/midicraft/songs by relative path.
def consoleOnlyLogging = { Test task ->
	task.systemProperty 'log4j2.configurationFile', file('gradle/log4j2-test.xml').toURI().toString()
	task.systemProperty 'log4j.configurationFile', file('gradle/log4j2-test.xml').toURI().toString()
}

test {
	// Regressions only. The library-wide probes are tagged 'sweep' and left out: they exist to price
	// a change once, not to be re-run on every build, and each of them plans every song at every
	// width and floor count -- several also read every build back through NoteMachineReader, which
	// costs far more than planning it. Together they had taken the suite from ten minutes to
	// forty-three, and a suite that long is one nobody runs.
	useJUnitPlatform {
		excludeTags 'sweep'
	}
	// The same forwarding sweepTest does, so a regression can be run with a flag the other way
	// instead of by editing the source and remembering to put it back. Bisecting which change turned
	// a test red is the case it is for.
	forwardProbeProperties(it)
	consoleOnlyLogging(it)
}

/**
 * Anything under these prefixes reaches the test JVM, so a probe can be re-aimed from the command
 * line instead of by editing it. Prefixes rather than the lot: forwarding everything would drag the
 * daemon's own properties across and change what the probes are measuring. 'probe.' is the one to
 * use for anything new -- the other two predate it and are what their own probes read.
 *
 * A probe whose prefix is missing here does not fail: it runs with its defaults and prints a full
 * page of numbers for the experiment nobody performed. That happened, and the only tell was that the
 * numbers came out identical to the digit.
 */
def forwardProbeProperties(task) {
	System.properties.each { key, value ->
		if (['fault.', 'census.', 'probe.'].any { key.toString().startsWith(it) }) {
			task.systemProperty(key.toString(), value)
		}
	}
}

/** The tagged probes, for when a change needs pricing. Never up to date: the point is the output. */
tasks.register('sweepTest', Test) {
	group = 'verification'
	description = 'Runs the library-wide measurement probes tagged "sweep".'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'sweep'
	}
	forwardProbeProperties(it)
	consoleOnlyLogging(it)
	outputs.upToDateWhen { false }
}
