org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

minecraft_version=26.3
# The Minecraft versions THIS branch's jar is built to serve. Drives both the
# jar name and the "minecraft" dependency in fabric.mod.json, so the two can
# never disagree. Either a single version (26.2), a range (1.21.9-1.21.10) or
# an x-range (26.2.x).
minecraft_support_range=26.3.x
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.161.0+26.3
modmenu_version=21.0.0

mod_version=0.1.0
maven_group=com.midicraft
archives_base_name=midicraft
